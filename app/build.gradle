plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.mikepenz.aboutlibraries.plugin.android'
}

// A real keystore in signing/ signs every build type when it is present, so the very first
// install is already release-signed and a later update can never hit
// INSTALL_FAILED_UPDATE_INCOMPATIBLE. It is gitignored: a fresh clone falls back to the
// default debug key rather than to a checked-in one, because a keystore committed to a
// public repo is not a signing key, it is a formality.
def realSigningProps = null
def realSigningPropsFile = rootProject.file('signing/signing.properties')
if (realSigningPropsFile.isFile()) {
    realSigningProps = new Properties()
    realSigningPropsFile.withInputStream { realSigningProps.load(it) }
}

android {
    compileSdk 36
    android.buildFeatures.buildConfig true
    defaultConfig {
        applicationId "com.wanderwildwood.tancho"
        minSdk 26
        targetSdk 35
        versionCode 59
        versionName "1.7.41"
    }

    lintOptions{
        disable 'MissingTranslation'
    }

    aaptOptions {
        noCompress "tflite"
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        if (realSigningProps != null) {
            real {
                storeFile rootProject.file('signing/signing.keystore')
                storePassword realSigningProps['STORE_PASSWORD']
                keyAlias realSigningProps['KEY_ALIAS']
                keyPassword realSigningProps['KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        debug {
            if (realSigningProps != null) signingConfig signingConfigs.real
        }
        release {
            // The one thing that differs between a release built here and the one GitHub
            // publishes: AGP stamps the git revision into META-INF, and the build box works
            // from an rsync with no .git, so it writes NO_SUPPORTED_VCS_FOUND where the CI
            // runner writes the commit. Off, so the two have identical contents.
            vcsInfo {
                include false
            }

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (realSigningProps != null) signingConfig signingConfigs.real
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    namespace 'com.wanderwildwood.tancho'
    androidResources {
        generateLocaleConfig true
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "androidx.core:core-ktx:1.13.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "com.google.android.material:material:1.12.0"
    // Not used directly: Material drags ConstraintLayout in behind it, and this pins that
    // to a version newer than the 2.0.1 it would otherwise settle on.
    implementation "androidx.constraintlayout:constraintlayout:2.2.1"
    implementation 'com.google.ai.edge.litert:litert:1.2.0'
    implementation "androidx.preference:preference:1.2.1"
    implementation "net.lingala.zip4j:zip4j:2.9.1"
    implementation 'uk.me.berndporr:iirj:1.7'

    // Compose and Mudita's own design system, pinned to the combination the other
    // Kompakt apps are built against rather than to the newest published.
    implementation 'androidx.activity:activity-compose:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.compose.ui:ui:1.9.5'
    implementation 'androidx.compose.foundation:foundation:1.9.5'
    implementation 'androidx.compose.material3:material3:1.4.0'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.9.5'
    implementation 'com.mudita:MMD:1.0.2'

    testImplementation 'junit:junit:4.13.2'
}

// The Licenses page lists what the build actually packs: this plugin walks each variant's runtime
// dependencies and writes res/raw/aboutlibraries.json (one entry per artifact, with its POM's
// licence). What Gradle cannot see (fonts, data sets, native code, desugaring) and licence texts
// of our own choosing are in config/libraries and config/licenses. Offline: the build fetches
// nothing; the full texts come from res/raw and config/licenses. The app reads the file with
// shared-licences' LicencesJson.kt (no AboutLibraries runtime library).
aboutLibraries {
    // getCollect() etc., not collect { }: Groovy reads that as its own Object.collect.
    offlineMode.set(true)
    getCollect().configPath.set(rootProject.file("config"))
    getCollect().fetchRemoteLicense.set(false)
    getCollect().fetchRemoteFunding.set(false)
    getCollect().includePlatform.set(false)
    getExport().excludeFields.addAll("funding")
    getLibrary().mergePlatformArtifacts.set(true)
    // Only what the release APK carries: these come in through debugImplementation (ui-tooling)
    // alone, so a debug build would otherwise list them too.
    getLibrary().exclusionPatterns.addAll(
        ["androidx.compose.ui:ui-tooling", "androidx.compose.ui:ui-tooling-data",
         "androidx.compose.material:material", "androidx.compose.material:material-icons-core",
        ].collect { java.util.regex.Pattern.compile("^" + java.util.regex.Pattern.quote(it) + "\$") }
    )
}

// The build fails when a bundled library has no license, or a license with no full text to show
// (neither its own text from config/licenses nor a family text in res/raw). Mudita review, 4 Nov 2026.
def licenceRawTexts = (file("src/main/res/raw").listFiles() ?: []).collect { it.name.toLowerCase() }
tasks.matching { it.name.startsWith("prepareLibraryDefinitions") }.configureEach { t ->
    def raw = licenceRawTexts
    inputs.property("licenceRawTexts", raw) // so the check reruns when a text is added or removed
    t.doLast {
        def family = { String n ->
            def l = n.toLowerCase()
            if (l.contains("classpath")) return "classpath"
            if (l.contains("lgpl") || l.contains("lesser general")) return "lgpl"
            if (l.contains("gpl") || l.contains("general public licen")) return "gpl"
            if (l.contains("unicode")) return "unicode"
            if (l.contains("apache")) return "apache"
            if (l.contains("mpl") || l.contains("mozilla")) return "mpl"
            if (l.split(/[^a-z]+/).contains("mit")) return "mit"
            if (l.contains("bsd")) return "bsd"
            if (l.contains("ofl") || l.contains("open font")) return "ofl"
            if (l.contains("cc-by") || l.contains("cc by") || l.contains("cc0") || l.contains("public domain")) return "none"
            return null
        }
        def bad = []
        t.outputs.files.asFileTree.matching { include("**/aboutlibraries.json") }.each { f ->
            def root = new groovy.json.JsonSlurper().parse(f)
            def lics = root.licenses ?: [:]
            // A library's own license file (config/licenses, with its copyright line) stands in for
            // the bare family entry its POM names: the plugin merges config entries in, it never
            // takes one out, so a library would otherwise list "MIT" twice, once with no text.
            def hasText = { k -> lics[k]?.content ? true : false }
            def famOf = { k -> family((lics[k]?.spdxId ?: lics[k]?.name ?: k).toString()) }
            def changed = false
            (root.libraries ?: []).each { lib ->
                def keys = lib.licenses ?: []
                def own = keys.findAll { hasText(it) }.collect { famOf(it) }.findAll { it != null } as Set
                def kept = keys.findAll { hasText(it) || !(famOf(it) in own) }
                if (kept != keys) { lib.licenses = kept; changed = true }
            }
            if (changed) f.text = groovy.json.JsonOutput.toJson(root)
            (root.libraries ?: []).each { lib ->
                def keys = lib.licenses ?: []
                if (keys.isEmpty()) bad << "${lib.uniqueId}: no license"
                keys.each { k ->
                    def e = lics[k] ?: [:]
                    if (!e.content) {
                        def fam = family((e.spdxId ?: e.name ?: k).toString())
                        if (fam == null || (fam != "none" && !raw.any { it.contains(fam) })) bad << "${lib.uniqueId}: no text for ${e.name ?: k}"
                    }
                }
            }
        }
        if (bad) throw new GradleException("Licenses page: add the text in config/licenses or res/raw:\n  " + bad.unique().join("\n  "))
    }
}
